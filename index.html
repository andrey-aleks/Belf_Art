<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Belf Art — Handmade Goods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css?v=3bd7e5ab" />
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">Belf Art</h1>
    <p class="site-tagline">Handmade goods, made with care</p>
    <a class="instagram-link" href="https://www.instagram.com/be1fegor_jewelry/" target="_blank" rel="noopener noreferrer">
      Order via Instagram @be1fegor_jewelry
    </a>
    <nav class="site-nav">
      <a href="index.html" aria-current="page">Shop</a>
      <a href="about.html">About</a>
      <a href="shipping.html">Shipping</a>
    </nav>
  </header>

  <main class="section">
    <h2 class="section-title">Shop</h2>
    <div class="shop-layout">
      <aside class="shop-filters" aria-label="Filter and sort products">
        <details class="filter-group" open>
          <summary>Availability</summary>
          <div class="filter-options">
            <label><input type="checkbox" class="filter-availability" value="in-stock" checked /> In stock</label>
            <label><input type="checkbox" class="filter-availability" value="out-of-stock" checked /> Out of stock</label>
          </div>
        </details>
        <details class="filter-group" open>
          <summary>Category</summary>
          <div id="category-filters" class="filter-options"></div>
        </details>
        <details class="filter-group" open>
          <summary>Sort by</summary>
          <div class="filter-options">
            <label><input type="radio" name="sort" class="filter-sort" value="relevant" checked /> Most relevant</label>
            <label><input type="radio" name="sort" class="filter-sort" value="price-asc" /> Price: low to high</label>
            <label><input type="radio" name="sort" class="filter-sort" value="price-desc" /> Price: high to low</label>
            <label><input type="radio" name="sort" class="filter-sort" value="name-asc" /> Name: A to Z</label>
            <label><input type="radio" name="sort" class="filter-sort" value="name-desc" /> Name: Z to A</label>
          </div>
        </details>
      </aside>
      <div id="product-grid" class="product-grid"></div>
    </div>
  </main>

  <div id="product-modal" class="product-modal" hidden>
    <div class="product-modal-backdrop" data-close></div>
    <div class="product-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="product-modal-title">
      <button type="button" class="product-modal-close" aria-label="Close" data-close>&times;</button>
      <div class="product-modal-gallery">
        <img class="product-modal-image" src="" alt="" />
        <div class="product-modal-thumbs"></div>
      </div>
      <div class="product-modal-info">
        <h3 id="product-modal-title" class="product-modal-title"></h3>
        <p class="product-modal-description"></p>
        <p class="product-modal-price"></p>
        <a class="order-button product-modal-order" href="" target="_blank" rel="noopener noreferrer">
          Order via Instagram
        </a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>To order, message us on <a href="https://www.instagram.com/be1fegor_jewelry/" target="_blank" rel="noopener noreferrer">Instagram</a>.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
