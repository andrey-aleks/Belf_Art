# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.222.1/schema/sveltia-cms.json
#
# Sveltia CMS configuration — the editor UI at /admin/.
# Generated structure mirrors content/*.json; see README.md "Editing content (CMS)".
# SECURITY: this file is public. Never put tokens, passwords or OAuth secrets here.

backend:
  name: github
  repo: andrey-aleks/Belf_Art
  branch: master
  # Personal-access-token sign-in only: no OAuth server or client secret exists.
  auth_methods: [token]
  commit_messages:
    create: "Content: create {{collection}} “{{slug}}”"
    update: "Content: update {{collection}} “{{slug}}”"
    delete: "Content: delete {{collection}} “{{slug}}”"
    uploadMedia: "Content: upload “{{path}}”"
    deleteMedia: "Content: delete “{{path}}”"

app_title: Belfegor — content editor
site_url: https://andrey-aleks.github.io/Belf_Art/

# Relative paths (no leading slash): the site is served from a sub-path on GitHub Pages.
media_folder: media/web
public_folder: media/web

media_libraries:
  all:
    # Rename uploads to safe, lowercase, dash-separated file names.
    slugify_filename: true
    # Phone photos are several MB and carry EXIF metadata (often the GPS location where
    # they were taken). Optimizing re-encodes them: resized, WebP, metadata stripped.
    max_file_size: 26214400
    transformations:
      raster_image:
        format: webp
        quality: 80
        width: 1600
        height: 1600

collections:
  - name: shop
    label: Shop
    icon: storefront
    files:
      - name: products
        label: Products
        file: content/products.json
        format: json
        fields:
          - name: products
            label: Products
            label_singular: Product
            widget: list
            summary: "{{fields.name.en}} — {{fields.price}} EUR"
            collapsed: true
            fields:
              - name: name
                label: Name
                widget: object
                fields:
                  - { name: en, label: English, widget: string }
                  - { name: ru, label: Russian, widget: string }
                  - { name: uk, label: Ukrainian, widget: string }
                  - { name: pl, label: Polish, widget: string }
              - name: description
                label: Description
                widget: object
                fields:
                  - { name: en, label: English, widget: text }
                  - { name: ru, label: Russian, widget: text }
                  - { name: uk, label: Ukrainian, widget: text }
                  - { name: pl, label: Polish, widget: text }
              - { name: price, label: Price (EUR), widget: number, value_type: float, min: 0 }
              - name: category
                label: Category
                widget: relation
                collection: shop
                file: categories
                value_field: categories.*.key
                search_fields: [categories.*.key]
                display_fields: [categories.*.key]
                hint: To add a new category, edit Shop → Categories first.
              - name: soldOut
                label: Sold out
                widget: boolean
                default: false
              - name: images
                label: Photos
                label_singular: Photo
                widget: list
                min: 1
                hint: The first photo is shown in the product grid; all of them in the detail window.
                field: { name: image, label: Photo, widget: image }
      - name: categories
        label: Categories
        file: content/categories.json
        format: json
        fields:
          - name: categories
            label: Categories
            label_singular: Category
            widget: list
            summary: "{{fields.key}}"
            hint: Categories appear as tiles above the product grid, in this order (only categories that have products are shown).
            fields:
              - name: key
                label: Internal name
                widget: string
                pattern: ['^[A-Za-z][A-Za-z0-9 -]*$', "Letters, numbers, spaces and dashes only"]
                hint: Used to link products to this category. Renaming it un-links existing products.
              - name: label
                label: Label shown on the site (plural, e.g. “Necklaces”)
                widget: object
                fields:
                  - { name: en, label: English, widget: string }
                  - { name: ru, label: Russian, widget: string }
                  - { name: uk, label: Ukrainian, widget: string }
                  - { name: pl, label: Polish, widget: string }

